name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/wyvox/action-setup-pnpm
      - uses: wyvox/action-setup-pnpm@d84148cd87d55adb709e92120c709b88d15bceac # v4.0.0
        with:
          node-version: 26

      - name: start rtorrent
        # starts rtorrent in docker using linuxserver/rutorrent
        run: |
          docker run -d \
            --name rtorrent-test \
            -p 8080:80 \
            -p 49164:49164/udp \
            -p 49164:49164 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=UTC \
            -v rtorrent-config:/config \
            -v rtorrent-downloads:/downloads \
            linuxserver/rutorrent:latest

          # Wait for rtorrent to start
          sleep 10

          # Check if container is running
          docker ps | grep rtorrent-test

      - name: lint
        run: pnpm run lint

      - name: test
        run: pnpm run test
